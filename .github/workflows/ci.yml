name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ci:
    uses: AtyaLibraries/github-workflows/.github/workflows/dotnet-package-ci.yml@1af7a8da0d8b01f11ab5437c0b2db0896b14e52b # v1.1.0
    with:
      solution: ./Cli.sln
      test-project: ./tests/Cli.UnitTests/Cli.UnitTests.csproj
      package-project: ./src/Cli/Cli.csproj
      fail-on-coverage: true
      coverage-line-min: 90
      coverage-branch-min: 80
